html<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio & Giulia | Matrimonio</title>
    
    <!-- TRUCCO 1: Inizia a caricare Joy in background mentre scorre il video -->
    <link rel="dns-prefetch" href="https://withjoy.com">
    <link rel="preconnect" href="https://withjoy.com" crossorigin>
    <link rel="prefetch" href="https://withjoy.com">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
    </style>
</head>
<body>

    <!-- Video ottimizzato per iPhone -->
    <video id="introVideo" autoplay muted playsinline webkit-playsinline preload="auto">
        <source src="intro.mp4" type="video/mp4">
        Il tuo browser non supporta i video HTML5.
    </video>

    <!-- TRUCCO 2: Reindirizzamento istantaneo non appena il video finisce o scattano i 5 secondi -->
    <script>
        const targetUrl = "https://withjoy.com";
        const video = document.getElementById('introVideo');
        let redirected = false;

        function doRedirect() {
            if (!redirected) {
                redirected = true;
                window.location.href = targetUrl; // Sposta istantaneamente l'utente
            }
        }

        // Se il video finisce prima dei 5 secondi, vai subito a Joy senza aspettare
        video.addEventListener('ended', doRedirect);

        // Sicurezza: se il video si blocca o rallenta, devia comunque dopo esattamente 5.2 secondi
        setTimeout(doRedirect, 5200);
    </script>

</body>
</html>
